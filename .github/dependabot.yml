version: 2
updates:
  - package-ecosystem: npm
    directory: /
    # PRs go through the usual development -> main flow instead of deploying on merge.
    target-branch: development
    schedule:
      interval: weekly
    # One PR for all minor/patch bumps; majors still get their own PR.
    groups:
      minor-and-patch:
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    target-branch: development
    schedule:
      interval: weekly
